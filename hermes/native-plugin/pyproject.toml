# Configuração só de ferramentas (lint e tipos) do plugin nativo radar_vagas; não empacota nada.
# O plugin é instalado copiando radar_vagas/ para /opt/data/plugins (ver radar_vagas/README.md).
# Na CI: `ruff check hermes/native-plugin` e `mypy --config-file hermes/native-plugin/pyproject.toml hermes/native-plugin`.

[tool.ruff]
target-version = "py310"
line-length = 140

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear e pyupgrade.
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
