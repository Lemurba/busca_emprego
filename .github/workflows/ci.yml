name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Smoke de UI (Playwright + axe) num job separado: só ele baixa o Chromium.
  ui-smoke:
    # Fixo em 24.04: o Playwright fixado (1.56.1, igual ao Chromium do ambiente
    # local) não instala navegador no ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Mesma matriz do build-and-test (TD-17): o bundle e o servidor também rodam no mínimo
    # de `engines`. Custa um download extra do Chromium (~1 min) por PR.
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.16", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Smoke de UI (todas as páginas, console limpo, axe sem serious/critical)
        run: npm run test:ui
      - name: Publicar relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Plugin nativo do Hermes (Python): lint (ruff) e tipos (mypy). Os testes unitários dele
  # rodam no `npm test` do build-and-test.
  python-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hermes/native-plugin/requirements-dev.txt
      - run: python -m pip install -r hermes/native-plugin/requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check hermes/native-plugin
      - name: Mypy (tipos)
        run: mypy --config-file hermes/native-plugin/pyproject.toml hermes/native-plugin

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Mínimo de `engines` (22.16: DatabaseSync.isTransaction) e a versão atual.
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.16", "24"]
    steps:
      # Actions fixadas por SHA de commit (tags são mutáveis).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high
      - name: Lint (Biome; warnings também falham)
        run: npm run lint
      - name: Typecheck (src/ e public/)
        run: npm run typecheck
      - run: npm run build
      # Testes de unidade (node:test + tsx, sem dist/), cobertura e plugin Python.
      # Inclui test/ops*.test.mjs (backup/restore SQLite) e test/migrations.test.mjs.
      # Cobertura mínima de src/ (linhas/branches/funções) definida no próprio script.
      - run: npm test
      # O build já rodou acima: test:e2e:dist não compila de novo (test:e2e = build + este).
      - name: Testes ponta a ponta (servidor real em dist/)
        run: npm run test:e2e:dist
      - name: Smoke dos agentes (instância isolada)
        run: node scripts/ops/smoke-agents.mjs
      - name: Validar CLIs operacionais
        run: |
          node scripts/ops/backup-sqlite.mjs --help
          node scripts/ops/restore-sqlite.mjs --help
          node scripts/ops/health-check.mjs --help
          node scripts/ops/automation.mjs --help
          node scripts/ops/check-liveness.mjs --help
      - name: Conferir pacote Hermes (skill em sincronia, JSON e shell válidos)
        run: |
          node scripts/ops/build-hermes-plugin.mjs --check
          for f in hermes/plugin/plugin.json hermes/plugin/mcp.json; do
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$f"
          done
          for f in hermes/cron/*.sh ops/hermes/*.sh; do sh -n "$f"; done
      - name: Verificar ausência de secrets versionados
        run: |
          # Procura VALORES atribuídos, não identificadores: código que só lê a variável de
          # ambiente não é secret versionado, mas qualquer `NOME=valor` plausível é barrado.
          # Lockfiles ficam de fora (hashes de integridade geram falsos positivos).
          names='TELEGRAM_BOT_TOKEN|RADAR_INTERNAL_SERVICE_TOKEN|RADAR_DASHBOARD_TOKEN|GLASSDOOR_PASSWORD|AWS_SECRET_ACCESS_KEY'
          patterns=(
            "(${names})[[:space:]]*[=:][[:space:]]*[\"']?[A-Za-z0-9_:+/-]{16,}"
            '-----BEGIN [A-Z ]*PRIVATE KEY-----'
            '(AKIA|ASIA)[0-9A-Z]{16}'
            '[0-9]{8,10}:[A-Za-z0-9_-]{35}'
            'Bearer [A-Za-z0-9_-]{24,}'
          )
          found=0
          for pattern in "${patterns[@]}"; do
            if git grep -nE -e "$pattern" -- . ':!package-lock.json' ':!**/package-lock.json' ':!npm-shrinkwrap.json' ':!.github/workflows/ci.yml'; then
              found=1
            fi
          done
          if [ "$found" -ne 0 ]; then
            echo 'Possível secret versionado' >&2
            exit 1
          fi
